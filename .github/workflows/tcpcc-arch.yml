name: TCPCC architecture

on:
  pull_request:
    branches:
      - 6.18.y
    paths:
      - '.github/workflows/tcpcc-arch.yml'
      - 'patches/**'
      - 'scripts/prepare-linux.sh'
      - 'scripts/validate-tcpcc-arch.sh'
      - 'upstream/**'
      - 'protected/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  defconfig-and-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout linux-tcp-cc
        uses: actions/checkout@v4

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential libelf-dev libssl-dev

      - name: Validate scripts
        run: |
          bash -n scripts/fetch-linux.sh
          bash -n scripts/verify-protected.sh
          bash -n scripts/prepare-linux.sh
          bash -n scripts/validate-tcpcc-arch.sh

      - name: Validate ARCH=tcpcc
        run: bash scripts/validate-tcpcc-arch.sh

      - name: Show tcpcc configuration
        run: |
          cat .build/tcpcc-arch.env
          grep -E '^(CONFIG_(TCPCC|64BIT|MMU|SMP|NR_CPUS|PREEMPT|FLATMEM))' \
            .build/tcpcc-out/.config | sort

      - name: Upload architecture provenance
        uses: actions/upload-artifact@v4
        with:
          name: tcpcc-arch-m2-1
          path: |
            .build/tcpcc-arch.env
            .build/tcpcc-out/.config
            .build/prepared.env
            .build/patches.sha256
          if-no-files-found: error
