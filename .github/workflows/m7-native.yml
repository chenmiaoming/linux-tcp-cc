name: M7 native Linux reference

on:
  pull_request:
    branches:
      - 6.18.y
    paths:
      - '.github/workflows/m7-native.yml'
      - 'benchmarks/m7/**'
      - 'scripts/collect-m7-hosted-report.py'
      - 'scripts/collect-m7-native-report.py'
      - 'scripts/fetch-linux.sh'
      - 'scripts/run-m7-native-lossless.sh'
      - 'tools/m7-native-tcp-probe.c'
      - 'upstream/linux.env'
  push:
    branches:
      - 6.18.y
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-lossless:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout linux-tcp-cc
        uses: actions/checkout@v4

      - name: Install native reference dependencies
        run: |
          echo 'debconf debconf/frontend select Noninteractive' | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential libelf-dev libssl-dev \
            git qemu-kvm udev iproute2 iputils-ping busybox-static coreutils \
            python3-requests python3-argcomplete libvirt-clients kbd kmod \
            file rsync zstd virtiofsd

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Validate M7 native inputs
        run: |
          mkdir -p .build
          bash -n scripts/fetch-linux.sh
          bash -n scripts/run-m7-native-lossless.sh
          python3 -m py_compile scripts/collect-m7-hosted-report.py
          python3 -m py_compile scripts/collect-m7-native-report.py
          python3 -m json.tool benchmarks/m7/scenarios-v1.json >/dev/null
          cc -O2 -Wall -Wextra -Werror -std=gnu11 \
            -o .build/m7-native-tcp-probe tools/m7-native-tcp-probe.c

      - name: Fetch pinned upstream Linux
        run: bash scripts/fetch-linux.sh

      - name: Fetch pinned virtme-ng harness
        run: |
          set -euo pipefail
          source benchmarks/m7/virtme-ng.env
          rm -rf .deps/virtme-ng
          git init -q .deps/virtme-ng
          git -C .deps/virtme-ng remote add origin "$VIRTME_NG_REMOTE"
          git -C .deps/virtme-ng fetch --depth=1 origin "$VIRTME_NG_COMMIT"
          git -C .deps/virtme-ng checkout --detach -q FETCH_HEAD
          actual_commit=$(git -C .deps/virtme-ng rev-parse HEAD)
          test "$actual_commit" = "$VIRTME_NG_COMMIT"
          {
            echo "VIRTME_NG_REMOTE=$VIRTME_NG_REMOTE"
            echo "VIRTME_NG_COMMIT=$actual_commit"
          } > .build/m7-virtme-ng.env

      - name: Build pinned native Linux kernel
        run: |
          set -euo pipefail
          source upstream/linux.env
          root="$GITHUB_WORKSPACE"
          localversion="-m7-${LINUX_COMMIT:0:12}"
          expected_release="${LINUX_VERSION}${localversion}"
          cd "$root/.deps/linux"
          "$root/.deps/virtme-ng/vng" \
            --build --skip-modules --jobs 4 \
            --config "$root/benchmarks/m7/native-kernel.config" \
            "LOCALVERSION=$localversion"
          test -s arch/x86/boot/bzImage
          actual_release=$(make -s kernelrelease "LOCALVERSION=$localversion")
          test "$actual_release" = "$expected_release"
          test "$(git rev-parse HEAD)" = "$LINUX_COMMIT"
          {
            echo "M7_NATIVE_EXPECTED_RELEASE=$expected_release"
            echo "M7_NATIVE_SOURCE_COMMIT=$LINUX_COMMIT"
          } > "$root/.build/m7-native-provenance.env"

      - name: Run M7.2 native lossless reference
        run: |
          set -euo pipefail
          source upstream/linux.env
          root="$GITHUB_WORKSPACE"
          expected_release="${LINUX_VERSION}-m7-${LINUX_COMMIT:0:12}"
          cd "$root/.deps/linux"
          "$root/.deps/virtme-ng/vng" \
            --skip-modules --cpus 2 --memory 1024M \
            -- bash "$root/scripts/run-m7-native-lossless.sh" \
               "$root/.build/m7-native-tcp-probe" | \
            tee "$root/.build/m7-native-lossless.log"
          actual_release=$(sed -n 's/^M7_NATIVE_KERNEL_RELEASE=//p' \
            "$root/.build/m7-native-lossless.log")
          actual_clocksource=$(sed -n 's/^M7_NATIVE_CLOCKSOURCE=//p' \
            "$root/.build/m7-native-lossless.log")
          test "$actual_release" = "$expected_release"
          test "$actual_clocksource" = "kvm-clock"

      - name: Emit M7.2 native parity baseline
        run: |
          python3 scripts/collect-m7-native-report.py \
            --scenario-file benchmarks/m7/scenarios-v1.json \
            --scenario hosted-lossless-delayed-50ms \
            --upstream-env .build/upstream.env \
            --virtme-env .build/m7-virtme-ng.env \
            --log .build/m7-native-lossless.log \
            --output .build/m7-native-lossless.json
          cat .build/m7-native-lossless.json

      - name: Upload M7.2 native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-native-lossless-reference
          path: |
            .build/m7-native-lossless.json
            .build/m7-native-lossless.log
            .build/m7-native-provenance.env
            .build/m7-virtme-ng.env
            .build/upstream.env
            .deps/linux/.config
          if-no-files-found: warn
