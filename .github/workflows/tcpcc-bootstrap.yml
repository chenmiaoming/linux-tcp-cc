name: TCPCC hosted bootstrap

on:
  pull_request:
    branches:
      - 6.18.y
    paths:
      - '.github/workflows/tcpcc-bootstrap.yml'
      - '.github/workflows/tcpcc-link.yml'
      - 'benchmarks/m7/**'
      - 'benchmarks/m8/**'
      - 'linux-overlay/**'
      - 'Makefile'
      - 'patches/**'
      - 'scripts/prepare-linux.sh'
      - 'scripts/validate-tcpcc-link.sh'
      - 'scripts/validate-tcpcc-bootstrap.sh'
      - 'scripts/validate-tcpcc-tun.sh'
      - 'scripts/validate-tcpcc-long-fat.sh'
      - 'scripts/run-tcpcc-control-test.py'
      - 'scripts/run-tcpcc-runtime-test.py'
      - 'scripts/run-tcpcc-m6-diagnostic.py'
      - 'scripts/run-tcpcc-tun-test.py'
      - 'scripts/run-tcpcc-capacity-discovery.py'
      - 'scripts/run-tcpcc-high-bdp-iperf.py'
      - 'scripts/test-tcpcc-cli.py'
      - 'scripts/test-tcpcc-cli-integration.py'
      - 'scripts/test-tcpcc-high-bdp-iperf.py'
      - 'scripts/collect-m7-hosted-report.py'
      - 'tools/tcpcc_cli.py'
      - 'tools/tcpcc_control.py'
      - 'tools/tcpcc_host.py'
      - 'tcpcc'
      - 'upstream/**'
      - 'protected/**'
  push:
    branches:
      - 6.18.y
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  start-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout linux-tcp-cc
        uses: actions/checkout@v4

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential libelf-dev libssl-dev strace iproute2 iputils-ping

      - name: Validate scripts
        run: |
          bash -n scripts/fetch-linux.sh
          bash -n scripts/verify-protected.sh
          bash -n scripts/prepare-linux.sh
          bash -n scripts/validate-tcpcc-link.sh
          bash -n scripts/validate-tcpcc-bootstrap.sh
          bash -n scripts/validate-tcpcc-tun.sh
          bash -n scripts/validate-tcpcc-long-fat.sh
          python3 -m py_compile scripts/run-tcpcc-control-test.py
          python3 -m py_compile scripts/run-tcpcc-runtime-test.py
          python3 -m py_compile scripts/run-tcpcc-m6-diagnostic.py
          python3 -m py_compile scripts/run-tcpcc-tun-test.py
          python3 -m py_compile scripts/run-tcpcc-capacity-discovery.py
          python3 -m py_compile scripts/run-tcpcc-high-bdp-iperf.py
          python3 -m py_compile scripts/test-tcpcc-cli.py
          python3 -m py_compile scripts/test-tcpcc-cli-integration.py
          python3 -m py_compile scripts/test-tcpcc-high-bdp-iperf.py
          python3 -m py_compile scripts/collect-m7-hosted-report.py
          python3 -m py_compile tools/tcpcc_cli.py
          python3 -m py_compile tools/tcpcc_control.py
          python3 -m py_compile tools/tcpcc_host.py
          python3 -m json.tool benchmarks/m7/scenarios-v1.json >/dev/null
          python3 -m json.tool benchmarks/m8/iperf-high-bdp-loss-v1.json >/dev/null

      - name: Exercise stable CLI and hosted runtime fault boundaries
        run: python3 scripts/test-tcpcc-cli.py

      - name: Exercise high-BDP iperf report contracts
        run: python3 scripts/test-tcpcc-high-bdp-iperf.py

      - name: Execute hosted M6.1 native BBR/default-fq regression
        run: bash scripts/validate-tcpcc-bootstrap.sh

      - name: Exercise real-TUN capacity, reset isolation, and stream regressions
        run: bash scripts/validate-tcpcc-tun.sh

      - name: Execute M8.4 nonblocking accept and clean shutdown boundary
        run: |
          python3 scripts/run-tcpcc-runtime-test.py \
            --kernel .build/tcpcc-bootstrap-out/vmlinux \
            --boot-log .build/tcpcc-m84-runtime.log

      - name: Stage the installed M8.5 command layout
        run: |
          make \
            DESTDIR="$PWD/.build/m85-install-root" \
            VMLINUX=.build/tcpcc-bootstrap-out/vmlinux \
            install
          .build/m85-install-root/usr/local/bin/tcpcc --help >/dev/null

      - name: Execute hosted M6.3 lossless delayed-path milestone
        run: bash scripts/validate-tcpcc-long-fat.sh

      - name: Emit M7.1 hosted parity baseline
        run: |
          python3 scripts/collect-m7-hosted-report.py \
            --scenario-file benchmarks/m7/scenarios-v1.json \
            --scenario hosted-lossless-delayed-50ms \
            --upstream-env .build/upstream.env \
            --tcp-log .build/tcpcc-long-fat-tcp.log \
            --ping-log .build/tcpcc-long-fat-ping.log \
            --qdisc-log .build/tcpcc-long-fat-qdisc.txt \
            --output .build/m7-hosted-lossless.json
          cat .build/m7-hosted-lossless.json

      - name: Upload M8.5 hosted kernel
        uses: actions/upload-artifact@v4
        with:
          name: tcpcc-m85-vmlinux
          path: .build/tcpcc-bootstrap-out/vmlinux
          if-no-files-found: error

      - name: Upload bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcpcc-bootstrap-m7-1
          path: |
            .build/tcpcc-bootstrap.log
            .build/tcpcc-control.responses
            .build/tcpcc-host.strace*
            .build/tcpcc-tun-bootstrap.log
            .build/tcpcc-tun-control.responses
            .build/tcpcc-tun-ping.log
            .build/tcpcc-tun-tcp.log
            .build/tcpcc-tun-link.txt
            .build/tcpcc-long-fat-bootstrap.log
            .build/tcpcc-long-fat-control.responses
            .build/tcpcc-long-fat-ping.log
            .build/tcpcc-long-fat-tcp.log
            .build/tcpcc-long-fat-link.txt
            .build/tcpcc-long-fat-qdisc.txt
            .build/tcpcc-m84-runtime.log
            .build/m7-hosted-lossless.json
            .build/tcpcc-vmlinux.program-headers
            .build/tcpcc-vmlinux.elf-header
            .build/tcpcc-link.env
            .build/prepared.env
            .build/upstream.env
            .build/patches.sha256
            .build/overlay.sha256
          if-no-files-found: warn

  cli-ingress:
    name: CLI ingress ${{ matrix.name }}
    needs: start-kernel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nft-lib
            backend: nft-lib
            iptables_variant: iptables
          - name: nft-exec
            backend: nft-exec
            iptables_variant: iptables
          - name: iptables-nft
            backend: iptables
            iptables_variant: iptables-nft
          - name: iptables-legacy
            backend: iptables
            iptables_variant: iptables-legacy
    steps:
      - name: Checkout linux-tcp-cc
        uses: actions/checkout@v4

      - name: Download M8.5 hosted kernel
        uses: actions/download-artifact@v4
        with:
          name: tcpcc-m85-vmlinux
          path: .build/tcpcc-bootstrap-out

      - name: Install privileged ingress dependencies
        run: |
          sudo -n apt-get update
          sudo -n env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y \
              iproute2 \
              iptables \
              libnftables1 \
              nftables \
              procps

      - name: Load available TUN, BBR, NAT, and conntrack modules
        run: |
          sudo -n modprobe tun || true
          sudo -n modprobe tcp_bbr || true
          sudo -n modprobe nf_tables || true
          sudo -n modprobe nf_nat || true
          sudo -n modprobe nf_conntrack || true
          sudo -n modprobe ip_tables || true
          sudo -n modprobe iptable_nat || true
          sudo -n modprobe xt_comment || true
          test -c /dev/net/tun
          command -v '${{ matrix.iptables_variant }}'
          sysctl net.ipv4.tcp_available_congestion_control | grep -w bbr
          chmod u+x tcpcc .build/tcpcc-bootstrap-out/vmlinux

      - name: Prove concurrent BBR ingress, backpressure, and signal drain
        run: |
          sudo -n python3 scripts/test-tcpcc-cli-integration.py \
            --integration \
            --firewall-backend '${{ matrix.backend }}' \
            --iptables-variant '${{ matrix.iptables_variant }}' \
            --kernel .build/tcpcc-bootstrap-out/vmlinux \
            --output-dir '.build/m85-cli-${{ matrix.name }}'

      - name: Upload M8.5 ingress diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcpcc-m85-cli-${{ matrix.name }}
          path: .build/m85-cli-${{ matrix.name }}
          if-no-files-found: warn

  capacity-discovery:
    name: M9 connection capacity discovery
    needs: start-kernel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout linux-tcp-cc
        uses: actions/checkout@v4

      - name: Download hosted kernel
        uses: actions/download-artifact@v4
        with:
          name: tcpcc-m85-vmlinux
          path: .build/tcpcc-bootstrap-out

      - name: Install capacity probe dependencies
        run: |
          sudo -n apt-get update
          sudo -n env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends iproute2 procps

      - name: Load TUN and prepare the hosted image
        run: |
          sudo -n modprobe tun || true
          test -c /dev/net/tun
          chmod u+x .build/tcpcc-bootstrap-out/vmlinux

      - name: Discover idle and active connection capacity
        run: |
          sudo -n python3 scripts/run-tcpcc-capacity-discovery.py \
            --integration \
            --kernel .build/tcpcc-bootstrap-out/vmlinux \
            --memory-mib 512 \
            --levels 64,256,1024,2048,4095,8192,16384 \
            --minimum 8192 \
            --active-connections 64 \
            --output .build/m9-capacity/report.json \
            --boot-log .build/m9-capacity/vmlinux.log

      - name: Upload capacity report and hosted log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcpcc-m9-capacity
          path: .build/m9-capacity
          if-no-files-found: warn

  high-bdp-iperf:
    name: High-BDP iperf native vs tcpcc
    needs: start-kernel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout linux-tcp-cc
        uses: actions/checkout@v4

      - name: Download M8.5 hosted kernel
        uses: actions/download-artifact@v4
        with:
          name: tcpcc-m85-vmlinux
          path: .build/tcpcc-bootstrap-out

      - name: Install privileged benchmark dependencies
        run: |
          sudo -n apt-get update
          sudo -n env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends \
              ethtool \
              iperf3 \
              iproute2 \
              iputils-ping \
              libnftables1 \
              nftables \
              procps

      - name: Load TUN, BBR, NAT, and conntrack prerequisites
        run: |
          sudo -n modprobe tun || true
          sudo -n modprobe tcp_bbr || true
          sudo -n modprobe nf_tables || true
          sudo -n modprobe nf_nat || true
          sudo -n modprobe nf_conntrack || true
          test -c /dev/net/tun
          sysctl net.ipv4.tcp_available_congestion_control | grep -w bbr
          chmod u+x tcpcc .build/tcpcc-bootstrap-out/vmlinux

      - name: Compare native CUBIC, native BBR, and tcpcc BBR
        run: |
          sudo -n env GITHUB_SHA="$GITHUB_SHA" \
            python3 scripts/run-tcpcc-high-bdp-iperf.py \
              --integration \
              --kernel .build/tcpcc-bootstrap-out/vmlinux \
              --scenario-file benchmarks/m8/iperf-high-bdp-loss-v1.json \
              --output-dir .build/m8-high-bdp
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path(".build/m8-high-bdp/report.json").read_text())
          print(json.dumps(report["summaries"], indent=2, sort_keys=True))
          PY

      - name: Upload high-BDP iperf report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcpcc-m85-high-bdp-iperf
          path: .build/m8-high-bdp
          if-no-files-found: warn
