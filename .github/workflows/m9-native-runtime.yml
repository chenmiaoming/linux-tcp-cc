name: M9 native runtime

on:
  pull_request:
    branches:
      - 6.18.y
    paths:
      - '.github/workflows/m9-native-runtime.yml'
      - '.github/workflows/release.yml'
      - 'Makefile'
      - 'tcpcc'
      - 'docs/m9-native-event-runtime.md'
      - 'docs/releases.md'
      - 'native/**'
      - 'scripts/package-release.sh'
      - 'linux-overlay/arch/tcpcc/include/asm/bridge.h'
      - 'linux-overlay/arch/tcpcc/include/asm/service.h'
      - 'linux-overlay/arch/tcpcc/include/asm/tcpcc_control_abi.h'
      - 'linux-overlay/arch/tcpcc/kernel/control.c'
      - 'linux-overlay/arch/tcpcc/kernel/service.c'
      - 'tools/tcpcc_control.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-runtime:
    name: native-runtime (Ubuntu 22.04 glibc x86-64)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout linux-tcp-cc
        uses: actions/checkout@v4

      - name: Build the native host boundary
        run: make native-build

      - name: Exercise control ABI and exec boundaries
        run: make native-check

      - name: Verify low-memory CLI contract
        run: |
          .build/native/tcpcc --help | grep -F -- '--memory-mib MIB              hosted memory, minimum 32 (default 128)'
          .build/native/tcpcc --help | grep -F -- '--tcp-wmem-max-kib KIB'

  native-runtime-musl:
    name: native-runtime (Alpine 3.22 musl x86-64)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout linux-tcp-cc
        uses: actions/checkout@v4

      - name: Build and test inside Alpine
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            alpine:3.22 \
            sh -euxc '
              apk add --no-cache build-base linux-headers binutils
              rm -rf .build/native
              make native-build
              make native-check
              readelf -lW .build/native/tcpcc | grep -F "/lib/ld-musl-x86_64.so.1"
              .build/native/tcpcc --help | grep -F -- "--memory-mib MIB              hosted memory, minimum 32 (default 128)"
              .build/native/tcpcc --help | grep -F -- "--tcp-wmem-max-kib KIB"
            '

      - name: Upload musl supervisor for deployment smoke tests
        uses: actions/upload-artifact@v4
        with:
          name: tcpcc-native-linux-x86_64-musl
          path: .build/native/tcpcc
          if-no-files-found: error
          retention-days: 14
