name: M8 host lifecycle

on:
  pull_request:
    branches:
      - 6.18.y
    paths:
      - '.github/workflows/m8-host-lifecycle.yml'
      - 'docs/m8-server-ingress-design.md'
      - 'Makefile'
      - 'scripts/test-tcpcc-composed-integration.py'
      - 'scripts/test-tcpcc-composed-lifecycle.py'
      - 'scripts/test-tcpcc-firewall-backends.py'
      - 'scripts/test-tcpcc-host-preflight.py'
      - 'scripts/test-tcpcc-nft-integration.py'
      - 'scripts/test-tcpcc-nft-lifecycle.py'
      - 'scripts/test-tcpcc-tun-lifecycle.py'
      - 'scripts/test-tcpcc-cli.py'
      - 'tcpcc'
      - 'tools/tcpcc_cli.py'
      - 'tools/tcpcc_control.py'
      - 'tools/tcpcc_host.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout linux-tcp-cc
        uses: actions/checkout@v4

      - name: Validate host lifecycle sources
        run: |
          python3 -m py_compile tools/tcpcc_host.py
          python3 -m py_compile scripts/test-tcpcc-composed-integration.py
          python3 -m py_compile scripts/test-tcpcc-composed-lifecycle.py
          python3 -m py_compile scripts/test-tcpcc-firewall-backends.py
          python3 -m py_compile scripts/test-tcpcc-host-preflight.py
          python3 -m py_compile scripts/test-tcpcc-nft-integration.py
          python3 -m py_compile scripts/test-tcpcc-nft-lifecycle.py
          python3 -m py_compile scripts/test-tcpcc-tun-lifecycle.py
          python3 -m py_compile scripts/test-tcpcc-cli.py
          python3 -m py_compile tools/tcpcc_cli.py
          python3 -m py_compile tools/tcpcc_control.py

      - name: Exercise stable CLI and hosted runtime fault boundaries
        run: python3 scripts/test-tcpcc-cli.py

      - name: Exercise deterministic host preflight
        run: python3 scripts/test-tcpcc-host-preflight.py

      - name: Exercise injected TUN lifecycle boundaries
        run: python3 scripts/test-tcpcc-tun-lifecycle.py

      - name: Exercise exact DNAT lifecycle boundaries
        run: python3 scripts/test-tcpcc-nft-lifecycle.py

      - name: Exercise composed lifecycle failure matrix
        run: python3 scripts/test-tcpcc-composed-lifecycle.py

      - name: Exercise all firewall backend boundaries and injected failures
        run: python3 scripts/test-tcpcc-firewall-backends.py

      - name: Prove nonpersistent TUN fd lifetime
        run: |
          command -v ip
          if [ ! -c /dev/net/tun ]; then
            sudo -n modprobe tun
          fi
          test -c /dev/net/tun
          sudo -n python3 scripts/test-tcpcc-tun-lifecycle.py --integration

  firewall-backends:
    name: Firewall ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nft-lib
            backend: nft-lib
            iptables_variant: iptables
          - name: nft-exec
            backend: nft-exec
            iptables_variant: iptables
          - name: iptables-nft
            backend: iptables
            iptables_variant: iptables-nft
          - name: iptables-legacy
            backend: iptables
            iptables_variant: iptables-legacy
    steps:
      - name: Checkout linux-tcp-cc
        uses: actions/checkout@v4

      - name: Install privileged network test dependencies
        run: |
          sudo -n apt-get update
          sudo -n env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y \
              conntrack \
              iproute2 \
              iptables \
              libnftables1 \
              nftables \
              procps

      - name: Load available TUN, NAT, and conntrack modules
        run: |
          sudo -n modprobe tun || true
          sudo -n modprobe nf_tables || true
          sudo -n modprobe nf_nat || true
          sudo -n modprobe nf_conntrack || true
          sudo -n modprobe ip_tables || true
          sudo -n modprobe iptable_nat || true
          sudo -n modprobe xt_comment || true
          test -c /dev/net/tun
          command -v '${{ matrix.iptables_variant }}'

      - name: Prove exact matching, TUN traffic, and reverse conntrack
        run: |
          sudo -n python3 \
            scripts/test-tcpcc-nft-integration.py \
            --integration \
            --backend '${{ matrix.backend }}' \
            --iptables-variant '${{ matrix.iptables_variant }}'

      - name: Prove rollback, signal cleanup, and stale diagnostics
        run: |
          sudo -n python3 \
            scripts/test-tcpcc-composed-integration.py \
            --integration \
            --backend '${{ matrix.backend }}' \
            --iptables-variant '${{ matrix.iptables_variant }}'
