name: M8 host lifecycle

on:
  pull_request:
    branches:
      - 6.18.y
    paths:
      - '.github/workflows/m8-host-lifecycle.yml'
      - 'docs/m8-server-ingress-design.md'
      - 'scripts/test-tcpcc-host-preflight.py'
      - 'tools/tcpcc_host.py'
  push:
    branches:
      - 6.18.y
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout linux-tcp-cc
        uses: actions/checkout@v4

      - name: Validate read-only preflight sources
        run: |
          python3 -m py_compile tools/tcpcc_host.py
          python3 -m py_compile scripts/test-tcpcc-host-preflight.py

      - name: Exercise deterministic host preflight
        run: python3 scripts/test-tcpcc-host-preflight.py
