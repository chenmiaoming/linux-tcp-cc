name: M7 lossless native-vs-hosted parity

on:
  pull_request:
    branches:
      - 6.18.y
    paths:
      - '.github/workflows/m7-lossless-parity.yml'
      - 'benchmarks/m7/**'
      - 'linux-overlay/**'
      - 'patches/**'
      - 'scripts/collect-m7-hosted-report.py'
      - 'scripts/collect-m7-native-report.py'
      - 'scripts/compare-m7-lossless.py'
      - 'scripts/test-compare-m7-lossless.py'
      - 'scripts/fetch-linux.sh'
      - 'scripts/prepare-linux.sh'
      - 'scripts/run-m7-native-lossless.sh'
      - 'scripts/validate-tcpcc-link.sh'
      - 'scripts/validate-tcpcc-bootstrap.sh'
      - 'scripts/validate-tcpcc-tun.sh'
      - 'scripts/validate-tcpcc-long-fat.sh'
      - 'scripts/run-tcpcc-control-test.py'
      - 'scripts/run-tcpcc-m6-diagnostic.py'
      - 'scripts/run-tcpcc-tun-test.py'
      - 'tools/m7-native-tcp-probe.c'
      - 'upstream/**'
      - 'protected/**'
  push:
    branches:
      - 6.18.y
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lossless-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout linux-tcp-cc
        uses: actions/checkout@v4

      - name: Install parity dependencies
        run: |
          echo 'debconf debconf/frontend select Noninteractive' | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential libelf-dev libssl-dev strace \
            git qemu-kvm udev iproute2 iputils-ping busybox-static coreutils \
            python3-requests python3-argcomplete libvirt-clients kbd kmod \
            file rsync zstd virtiofsd

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Validate M7.3 inputs
        run: |
          mkdir -p .build
          bash -n scripts/fetch-linux.sh
          bash -n scripts/run-m7-native-lossless.sh
          bash -n scripts/prepare-linux.sh
          bash -n scripts/validate-tcpcc-link.sh
          bash -n scripts/validate-tcpcc-bootstrap.sh
          bash -n scripts/validate-tcpcc-tun.sh
          bash -n scripts/validate-tcpcc-long-fat.sh
          python3 -m py_compile scripts/collect-m7-hosted-report.py
          python3 -m py_compile scripts/collect-m7-native-report.py
          python3 -m py_compile scripts/compare-m7-lossless.py
          python3 -m py_compile scripts/test-compare-m7-lossless.py
          python3 scripts/test-compare-m7-lossless.py
          python3 -m json.tool benchmarks/m7/scenarios-v1.json >/dev/null
          python3 -m json.tool benchmarks/m7/parity-thresholds-v1.json >/dev/null
          cc -O2 -Wall -Wextra -Werror -std=gnu11 \
            -o .build/m7-native-tcp-probe tools/m7-native-tcp-probe.c

      - name: Fetch pinned upstream Linux
        run: bash scripts/fetch-linux.sh

      - name: Fetch pinned virtme-ng harness
        run: |
          set -euo pipefail
          source benchmarks/m7/virtme-ng.env
          rm -rf .deps/virtme-ng
          git init -q .deps/virtme-ng
          git -C .deps/virtme-ng remote add origin "$VIRTME_NG_REMOTE"
          git -C .deps/virtme-ng fetch --depth=1 origin "$VIRTME_NG_COMMIT"
          git -C .deps/virtme-ng checkout --detach -q FETCH_HEAD
          actual_commit=$(git -C .deps/virtme-ng rev-parse HEAD)
          test "$actual_commit" = "$VIRTME_NG_COMMIT"
          {
            echo "VIRTME_NG_REMOTE=$VIRTME_NG_REMOTE"
            echo "VIRTME_NG_COMMIT=$actual_commit"
          } > .build/m7-virtme-ng.env

      - name: Build pristine pinned native Linux kernel
        run: |
          set -euo pipefail
          source upstream/linux.env
          root="$GITHUB_WORKSPACE"
          localversion="-m7-${LINUX_COMMIT:0:12}"
          expected_release="${LINUX_VERSION}${localversion}"
          build_jobs="$(nproc)"
          echo "M7_NATIVE_BUILD_JOBS=$build_jobs"
          cd "$root/.deps/linux"
          "$root/.deps/virtme-ng/vng" \
            --build --skip-modules --jobs "$build_jobs" \
            --config "$root/benchmarks/m7/native-kernel.config" \
            "LOCALVERSION=$localversion"
          test -s arch/x86/boot/bzImage
          actual_release=$(make -s kernelrelease "LOCALVERSION=$localversion")
          test "$actual_release" = "$expected_release"
          test "$(git rev-parse HEAD)" = "$LINUX_COMMIT"

      - name: Run pristine native lossless reference
        run: |
          set -euo pipefail
          source upstream/linux.env
          root="$GITHUB_WORKSPACE"
          expected_release="${LINUX_VERSION}-m7-${LINUX_COMMIT:0:12}"
          cd "$root/.deps/linux"
          "$root/.deps/virtme-ng/vng" \
            --skip-modules --cpus 2 --memory 1024M \
            -- bash "$root/scripts/run-m7-native-lossless.sh" \
               "$root/.build/m7-native-tcp-probe" | \
            tee "$root/.build/m7-native-lossless.log"
          actual_release=$(sed -n 's/^M7_NATIVE_KERNEL_RELEASE=//p' \
            "$root/.build/m7-native-lossless.log")
          actual_clocksource=$(sed -n 's/^M7_NATIVE_CLOCKSOURCE=//p' \
            "$root/.build/m7-native-lossless.log")
          test "$actual_release" = "$expected_release"
          test "$actual_clocksource" = "kvm-clock"

      - name: Emit native parity report
        run: |
          python3 scripts/collect-m7-native-report.py \
            --scenario-file benchmarks/m7/scenarios-v1.json \
            --scenario hosted-lossless-delayed-50ms \
            --upstream-env .build/upstream.env \
            --virtme-env .build/m7-virtme-ng.env \
            --log .build/m7-native-lossless.log \
            --output .build/m7-native-lossless.json

      - name: Build and execute hosted path after native baseline
        run: |
          bash scripts/validate-tcpcc-bootstrap.sh
          bash scripts/validate-tcpcc-tun.sh
          bash scripts/validate-tcpcc-long-fat.sh

      - name: Emit hosted parity report
        run: |
          python3 scripts/collect-m7-hosted-report.py \
            --scenario-file benchmarks/m7/scenarios-v1.json \
            --scenario hosted-lossless-delayed-50ms \
            --upstream-env .build/upstream.env \
            --tcp-log .build/tcpcc-long-fat-tcp.log \
            --ping-log .build/tcpcc-long-fat-ping.log \
            --qdisc-log .build/tcpcc-long-fat-qdisc.txt \
            --output .build/m7-hosted-lossless.json

      - name: Gate native-vs-hosted parity
        run: |
          python3 scripts/compare-m7-lossless.py \
            --native .build/m7-native-lossless.json \
            --hosted .build/m7-hosted-lossless.json \
            --thresholds benchmarks/m7/parity-thresholds-v1.json \
            --output .build/m7-lossless-parity.json
          cat .build/m7-lossless-parity.json

      - name: Upload M7.3 parity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-lossless-parity
          path: |
            .build/m7-native-lossless.json
            .build/m7-native-lossless.log
            .build/m7-hosted-lossless.json
            .build/m7-lossless-parity.json
            .build/tcpcc-long-fat-bootstrap.log
            .build/tcpcc-long-fat-control.responses
            .build/tcpcc-long-fat-ping.log
            .build/tcpcc-long-fat-tcp.log
            .build/tcpcc-long-fat-link.txt
            .build/tcpcc-long-fat-qdisc.txt
            .build/upstream.env
            .build/m7-virtme-ng.env
          if-no-files-found: warn
