name: Release package

on:
  workflow_run:
    workflows:
      - TCPCC hosted bootstrap
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == '6.18.y' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout the exact validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Require an upstream Linux pin change
        id: trigger
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
          parent=$(git rev-parse HEAD^)
          result=$(bash scripts/check-release-trigger.sh "$parent" HEAD)
          echo "$result"
          if [[ "$result" == 'release_eligible=false' ]]; then
            echo "No upstream/linux.env change; ordinary project commits do not publish Releases." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Resolve immutable release identity
        if: steps.trigger.outputs.eligible == 'true'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
          source upstream/linux.env
          test "$LINUX_TAG" = "v$LINUX_VERSION"
          echo "tag=$LINUX_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$LINUX_VERSION" >> "$GITHUB_OUTPUT"

          if gh release view "$LINUX_TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$LINUX_TAG is already published; release tags are immutable." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git ls-remote --exit-code origin "refs/tags/$LINUX_TAG" >/dev/null 2>&1; then
            echo "tag $LINUX_TAG exists without a GitHub Release" >&2
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Download the validated hosted image
        if: >-
          steps.trigger.outputs.eligible == 'true' &&
          steps.release.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          name: tcpcc-m85-vmlinux
          path: .build/tcpcc-bootstrap-out
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Build and test the glibc native C supervisor
        if: >-
          steps.trigger.outputs.eligible == 'true' &&
          steps.release.outputs.skip == 'false'
        run: |
          make native-build
          make native-check
          mkdir -p .build/release-native
          cp .build/native/tcpcc .build/release-native/tcpcc-glibc
          readelf -lW .build/release-native/tcpcc-glibc | \
            grep -F '/lib64/ld-linux-x86-64.so.2'
          chmod 0755 .build/tcpcc-bootstrap-out/vmlinux

      - name: Build and test the musl native C supervisor in Alpine
        if: >-
          steps.trigger.outputs.eligible == 'true' &&
          steps.release.outputs.skip == 'false'
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            alpine:3.22 \
            sh -euxc '
              apk add --no-cache build-base linux-headers binutils
              rm -rf .build/native
              make native-build
              make native-check
              readelf -lW .build/native/tcpcc | grep -F "/lib/ld-musl-x86_64.so.1"
              .build/native/tcpcc --help >/dev/null
              cp .build/native/tcpcc .build/release-native/tcpcc-musl
            '

      - name: Build the normalized release archives
        if: >-
          steps.trigger.outputs.eligible == 'true' &&
          steps.release.outputs.skip == 'false'
        run: |
          bash -n scripts/package-release.sh
          VMLINUX=.build/tcpcc-bootstrap-out/vmlinux \
            NATIVE_CLI=.build/release-native/tcpcc-glibc \
            TARGET=linux-x86_64-glibc \
            scripts/package-release.sh
          VMLINUX=.build/tcpcc-bootstrap-out/vmlinux \
            NATIVE_CLI=.build/release-native/tcpcc-musl \
            TARGET=linux-x86_64-musl \
            scripts/package-release.sh

      - name: Validate the packaged installed layouts
        if: >-
          steps.trigger.outputs.eligible == 'true' &&
          steps.release.outputs.skip == 'false'
        run: |
          source upstream/linux.env
          for target in linux-x86_64-glibc linux-x86_64-musl; do
            archive=".build/release/tcpcc-${LINUX_VERSION}-${target}.tar.xz"
            test -f "$archive"
            test -f "$archive.sha256"
            test -f ".build/release/tcpcc-${LINUX_VERSION}-${target}.manifest.env"
            extract_root=$(mktemp -d)
            tar -xJf "$archive" -C "$extract_root"
            package_root="$extract_root/tcpcc-${LINUX_VERSION}-${target}"
            test -x "$package_root/bin/tcpcc"
            test -x "$package_root/libexec/tcpcc/vmlinux"
            if [[ "$target" == linux-x86_64-glibc ]]; then
              "$package_root/bin/tcpcc" --help >/dev/null
            else
              docker run --rm \
                -v "$package_root:/pkg:ro" \
                alpine:3.22 \
                /pkg/bin/tcpcc --help >/dev/null
            fi
            test ! -e "$package_root/lib/tcpcc"
            test ! -e "$package_root/bin/python"
            grep -Fx "TCPCC_TARGET=$target" \
              "$package_root/share/doc/tcpcc/RELEASE.env"
            rm -rf "$extract_root"
          done

      - name: Publish the immutable GitHub Release
        if: >-
          steps.trigger.outputs.eligible == 'true' &&
          steps.release.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          VALIDATION_RUN: ${{ github.event.workflow_run.html_url }}
        run: |
          notes=$(mktemp)
          cat > "$notes" <<EOF
          tcpcc built from upstream Linux $RELEASE_TAG for the 6.18.y LTS product
          branch. Each archive contains the native C supervisor plus the same
          validated hosted vmlinux and has no Python runtime dependency.

          Validation: $VALIDATION_RUN

          Choose the linux-x86_64-glibc archive for glibc distributions or the
          linux-x86_64-musl archive for musl distributions such as Alpine Linux,
          then verify it with the attached SHA-256 file. Installation and exact
          upstream source provenance are included inside each archive.
          EOF

          gh release create "$RELEASE_TAG" \
            .build/release/*.tar.xz \
            .build/release/*.tar.xz.sha256 \
            .build/release/*.manifest.env \
            --target "$VALIDATED_SHA" \
            --title "tcpcc $RELEASE_VERSION" \
            --notes-file "$notes"
